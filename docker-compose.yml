version: "3.8"

services:
  valenote:
    image: bytetopia/valenote:latest
    # build: .  # Uncomment to build locally instead of using Docker Hub image
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./notes:/notes
    environment:
      - VALENOTE_SECRET_KEY=${VALENOTE_SECRET_KEY:-change-me-in-production}
      - VALENOTE_MODE=release
    restart: unless-stopped
